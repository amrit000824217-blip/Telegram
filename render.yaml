services:
  - type: web
    name: telegram-link-manager
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn bot:app --workers 1 --threads 4 --timeout 120

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_ID
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: WEBHOOK_SECRET
        generateValue: true

      - key: UPDATE_SECRET
        generateValue: true
